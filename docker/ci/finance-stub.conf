# CI only: a stand-in for the finance backend (container "personal-finance-api" on the network "finance").
# It answers the readiness check, and echoes what each proxied request carried, so CI can check the proxy
# (and the gateway token, T03).
server {
    listen 8080;

    location = /health/ready {
        default_type text/plain;
        return 200 "Healthy";
    }

    location / {
        default_type application/json;
        return 200 '{"stub":"finance","path":"$request_uri","host":"$http_host","forwardedFor":"$http_x_forwarded_for","forwardedProto":"$http_x_forwarded_proto","cookie":"$http_cookie","authorization":"$http_authorization"}';
    }
}
