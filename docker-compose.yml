# Copy .env.example to .env and set the password before `docker compose up --build`.
# Start the finance project first: it makes the "finance" network that this project joins.

# Docker keeps container logs forever by default; cap each service at 3 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hestia-api:
    build: .
    container_name: hestia-api
    # Clients reach the host only through the frontend (nginx behind Tailscale HTTPS), over the
    # "finance" network, as http://hestia-api:8080. The port stays open on this machine alone, for curl and debugging.
    ports:
      - "127.0.0.1:5097:8080"
    networks:
      - default
      - finance
    environment:
      ConnectionStrings__Hestia: "Host=hestia-db;Port=5432;Database=${POSTGRES_DB:-Hestia};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      # The finance backend (T02: the host proxies the finance paths to it). Its container name on "finance".
      FinanceProxy__Address: ${FINANCE_API_URL:-http://personal-finance-api:8080}
      # T85: which day it is for all modules (Today, Alerts, Tasks, Home, People). Use the same zone as
      # finance (its Reports:TimeZone), so "this month" matches. A module can override it with <Module>__TimeZone.
      Hestia__TimeZone: ${TZ:-America/Toronto}
      # T04: the RabbitMQ broker of the finance project (on "finance"), for the finance events. Empty: no finance events.
      Events__RabbitMq: ${EVENTS_RABBITMQ_URL:-}
      # T04: a debug consumer logs every event. For a check, not for every day.
      Events__LogAll: ${EVENTS_LOG_ALL:-false}
      # T03: the private key that signs the gateway token of each finance request (see "Sign-in" in the README).
      FinanceProxy__SigningKey: "${GATEWAY_SIGNING_KEY:?Set GATEWAY_SIGNING_KEY in .env (see Sign-in in the README)}"
      # T03: optional. An account that the host makes when it starts (or import the finance account once).
      Identity__InitialUser__Username: "${HESTIA_USERNAME:-}"
      Identity__InitialUser__Password: "${HESTIA_PASSWORD:-}"
      Identity__InitialUser__ResetPassword: "${HESTIA_RESET_PASSWORD:-false}"
      # T03: optional. A bearer token that reads but changes nothing (scripts, an assistant). Empty turns it off.
      Identity__ReadOnlyToken: "${HESTIA_READONLY_TOKEN:-}"
      # T11: the files of the Documents module, on the volume "hestia_documents" (D9).
      Documents__StoragePath: /data/documents
      # T11: the Tesseract language(s) of the OCR. The image has English (eng) only.
      Documents__Ocr__Language: ${DOCUMENTS_OCR_LANGUAGE:-eng}
      # T99: the status files of the backup jobs, for the "backups" readiness check and the System alerts on Today.
      Backups__StatusPath: /status
      # T102: email to the Inbox. A mailbox that only Hestia uses; only the allowed senders count. Off by default.
      Inbox__Mail__Enabled: ${INBOX_MAIL_ENABLED:-false}
      Inbox__Mail__Host: ${INBOX_MAIL_HOST:-}
      Inbox__Mail__Port: ${INBOX_MAIL_PORT:-993}
      Inbox__Mail__Username: ${INBOX_MAIL_USERNAME:-}
      Inbox__Mail__Password: ${INBOX_MAIL_PASSWORD:-}
      Inbox__Mail__AllowedSenders: ${INBOX_MAIL_ALLOWED_SENDERS:-}
    volumes:
      - hestia_documents:/data/documents
      # T99: the status of the Hestia backups (backup.sh writes it), and of the finance backups: set
      # FINANCE_BACKUP_STATUS_DIR to the status folder of finance (<finance folder>/backups/status). Without it, the
      # same volume is mounted twice, and the host checks the Hestia backups only.
      - hestia_backup_status:/status/hestia:ro
      - ${FINANCE_BACKUP_STATUS_DIR:-hestia_backup_status}:/status/finance:ro
    depends_on:
      hestia-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    # The image has no curl: bash asks /health/live itself (the process answers; no database or finance needed).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hestia-db:
    image: postgres:17
    container_name: hestia-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-Hestia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The finance PostgreSQL uses 127.0.0.1:5432 on the same machine; this one uses 5433.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hestia_postgres_data:/var/lib/postgresql/data
    logging: *logging

  # Dumps the database when it starts and every night (docker/backup.sh), into the Docker volume
  # "hestia_backups". Restore with docker/restore.sh. A backup on the same disk does not survive the
  # disk: copy the dumps somewhere else too (see "Backups" in the README).
  backup:
    # Same image as the database, so pg_dump always matches the server version (17).
    image: postgres:17
    container_name: hestia-backup
    # Starts as root to give the backup folder to BACKUP_UID, then runs as that user (see backup.sh).
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: hestia-db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-Hestia}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-999}
      BACKUP_GID: ${BACKUP_GID:-999}
      TZ: ${TZ:-America/Toronto}
      # T11: the owner of the document files: the "app" user of the .NET image. restore.sh gives them back to it.
      DOCUMENTS_OWNER: "1654:1654"
      # T99: after each nightly dump, restore it into a scratch database and check it. "false" turns it off.
      BACKUP_VERIFY: ${BACKUP_VERIFY:-true}
    volumes:
      # A volume name, or a folder on this machine (for example BACKUP_DIR=./backups).
      - ${BACKUP_DIR:-hestia_backups}:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      # T11: the document files. Each dump gets a copy of them next to it (backup.sh), and restore.sh puts them back.
      - hestia_documents:/documents
      # T99: the status file (hestia.json) of the newest dump and restore check, for Hestia.Api.
      - hestia_backup_status:/status
    depends_on:
      hestia-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    # Unhealthy when the newest dump is more than 26 hours old (a nightly run failed).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'hestia-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      start_period: 2m
      start_interval: 5s

networks:
  # Made by the finance backend's compose project. The database stays on this project's default network only.
  finance:
    name: finance
    external: true

volumes:
  hestia_postgres_data:
  # A fixed name, so it is easy to find: `docker volume inspect hestia_backups`.
  hestia_backups:
    name: hestia_backups
  # T11: the files of the Documents module. The rows are in the database; backup.sh copies both.
  hestia_documents:
    name: hestia_documents
  # T99: the status files of the backup jobs (no secrets). The backup container writes, Hestia.Api reads.
  hestia_backup_status:
    name: hestia_backup_status
