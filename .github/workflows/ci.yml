name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so advisories published after the last commit still fail the vulnerability check.
  schedule:
    - cron: '17 6 * * 1'

# Bash with pipefail: a failed command in a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      # Packages that the host ships with; test-only packages and low-severity advisories do not block.
      - name: Known vulnerabilities
        run: sh scripts/check-vulnerable-packages.sh
      - run: dotnet build --no-restore
      # The code-style rules that .editorconfig sets as warnings (file-scoped namespaces); whitespace is left alone.
      - name: Code style
        run: dotnet format style --verify-no-changes --no-restore --severity warn
      - run: dotnet tool restore

      - name: Migrations match the model (each module)
        run: sh scripts/check-migrations.sh

      # T11: the OCR programs of the host image, so the Documents tests run the real OCR on the sample files.
      - name: OCR programs (ocrmypdf, Tesseract, pdftotext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ocrmypdf tesseract-ocr-eng poppler-utils > /dev/null
          echo "::notice title=OCR programs::$(ocrmypdf --version), $(tesseract --version 2>&1 | head -n 1), $(pdftotext -v 2>&1 | head -n 1)"

      # Includes the architecture tests (tests/Hestia.Architecture.Tests): the module rules of D6.
      # --report-xunit-trx: xUnit v3 writes one TRX file per test project, for the annotations (T26).
      - name: Tests (in-memory database)
        id: tests-in-memory
        run: dotnet test --no-build --results-directory TestResults/in-memory --report-xunit-trx
      # Totals and failed tests as annotations: task sessions cannot read the logs, only the annotations.
      - name: Test results (in-memory database)
        if: always() && steps.tests-in-memory.outcome != 'skipped'
        run: python3 scripts/test-annotations.py in-memory TestResults/in-memory

      # The tests start PostgreSQL and RabbitMQ themselves in Docker (Testcontainers) and remove them afterwards.
      - name: Tests (PostgreSQL migrated from scratch, RabbitMQ)
        id: tests-postgres
        run: dotnet test --no-build --results-directory TestResults/postgres --report-xunit-trx
        env:
          HESTIA_TEST_POSTGRES: container
          HESTIA_TEST_RABBITMQ: container
      - name: Test results (PostgreSQL, RabbitMQ)
        if: always() && steps.tests-postgres.outcome != 'skipped'
        run: python3 scripts/test-annotations.py postgres TestResults/postgres

  # Publishes Hestia.Contracts to GitHub Packages, for the finance backend (T04).
  # main: the version in the project file (once: a version that exists is skipped).
  # A pull request from this repository that changes the contracts: a prerelease, <version>-pr.<number>.<run>.
  contracts-package:
    needs: build-and-test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Decide the version
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if git diff --quiet "origin/$GITHUB_BASE_REF...$HEAD_SHA" -- src/Hestia.Contracts; then
              echo "The pull request does not change the contracts: nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # T51: every push to a pull request that changes the contracts gets its own prerelease, also a push that
            # only fixes the build, so a session never needs a dummy change.
            echo "suffix=pr.${{ github.event.number }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: >
          dotnet pack src/Hestia.Contracts -c Release -o packages
          ${{ steps.version.outputs.suffix && format('--version-suffix {0}', steps.version.outputs.suffix) || '' }}
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        run: |
          ls packages
          echo "::notice title=Hestia.Contracts::Published $(ls packages/*.nupkg | xargs -n1 basename | sed -e 's/^Hestia.Contracts.//' -e 's/.nupkg$//') (use this version in finance)"
          dotnet nuget push "packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # What .env provides on the server.
    env:
      POSTGRES_PASSWORD: ci-database-password
      EVENTS_RABBITMQ_URL: amqp://hestia:ci-rabbitmq-password@rabbitmq:5672
      HESTIA_USERNAME: ci
      HESTIA_PASSWORD: ci-password-long-enough
    steps:
      - uses: actions/checkout@v7
      # T03: the key pair of the gateway tokens, as in the README ("Sign-in"). New for each run.
      - name: The gateway signing key
        run: |
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/gateway.key"
          echo "GATEWAY_SIGNING_KEY=$(openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/gateway.key" -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/gateway.key"
      # On the server, the finance project makes this network.
      - name: The shared "finance" network
        run: docker network create finance
      # On the server, the finance project runs the finance backend under this name. Here, a small nginx echo.
      - name: A stand-in for the finance backend
        run: >
          docker run -d --name personal-finance-api --network finance
          -v "$PWD/docker/ci/finance-stub.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
      - name: Build and start the stack (host, PostgreSQL, and backup, as deployed)
        run: docker compose up -d --build --wait
      - name: /health/ready answers 200 (the databases and finance answer)
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5097/health/ready && exit 0; sleep 1; done
          exit 1
      # T64: the answer is JSON with the name and status of each check, and nothing more (the endpoint is open).
      - name: /health/ready answers JSON with each check
        run: |
          body=$(curl -sf http://localhost:5097/health/ready)
          echo "$body"
          # Healthy, or Degraded when a check that can only warn does (for example the broker, T37).
          echo "$body" | jq -e '.status == "Healthy" or .status == "Degraded"'
          echo "$body" | jq -e '[.checks[] | select(.name == "database" or .name == "finance" or .name == "documents-storage")
            | .status] == ["Healthy", "Healthy", "Healthy"]'
          echo "$body" | jq -e 'all(.checks[]; keys == ["name", "status"])'
          echo "$body" | jq -e 'keys == ["checks", "status"]'
      # T03: health, sign-in, the session cookie, a module, finance (the stub), sign-out, and 401 without a session.
      - name: Smoke test (docker/smoke-test.sh)
        run: docker/smoke-test.sh http://localhost:5097
      - name: Sign in (a session cookie for the next steps)
        run: |
          session=$(curl -sf -D - -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"username\":\"$HESTIA_USERNAME\",\"password\":\"$HESTIA_PASSWORD\"}" http://localhost:5097/api/Auth/login \
            | grep -i '^set-cookie: finance_session=' | sed -E 's/^[^:]*: ([^;]*);.*/\1/I')
          test -n "$session"
          echo "SESSION_COOKIE=$session" >> "$GITHUB_ENV"
      - name: Finance paths go through the host to finance, with a gateway token and without the session cookie
        run: |
          body=$(curl -sf -H 'Host: hestia.example.ts.net' -H 'X-Forwarded-Proto: https' -H "Cookie: $SESSION_COOKIE; theme=dark" \
            'http://localhost:5097/api/Transaction?categoryId=4&startDate=2026-10-01')
          echo "$body" | jq 'del(.authorization)'
          echo "$body" | jq -e '.stub == "finance"
            and .path == "/api/Transaction?categoryId=4&startDate=2026-10-01"
            and .host == "hestia.example.ts.net"
            and .forwardedProto == "https"
            and .cookie == "theme=dark"
            and (.authorization | startswith("Bearer "))'
          # The claims of the token (the tests check the signature as finance does).
          payload=$(echo "$body" | jq -r '.authorization | ltrimstr("Bearer ") | split(".")[1] | gsub("-"; "+") | gsub("_"; "/")')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "$payload" | base64 -d | jq -e '.iss == "hestia-api" and .aud == "finance" and .name == "ci"
            and .scope == "full" and (.exp - .iat) == 60'
      - name: Module paths stay in the host
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/sample/items)
          echo "$body"
          echo "$body" | jq -e 'has("stub") | not'
      # T08: the Today cards. The stub answers every finance report with its echo, so the account list does not
      # load and the Money module is "Partial"; the four tiles are there. The host found its time zone (Today__TimeZone).
      - name: Today answers with the Money cards first
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/today)
          echo "$body" | jq -c '{date, modules, tiles: [.cards[] | select(.type == "Tile") | .id]}'
          echo "$body" | jq -e '.modules[0].module == "Money" and .modules[0].status == "Partial"
            and ([.cards[] | select(.type == "Tile" and .module == "Money") | .id] == ["money.spent-this-month", "money.left-over-this-month", "money.net-worth", "money.budgets"])'
          # Other modules show their tiles after Money (T19: Tasks).
          echo "$body" | jq -e '[.cards[] | select(.type == "Tile") | .module] | .[0:4] == ["Money", "Money", "Money", "Money"]'
      # T11: a document with a scanned PDF (no text layer) and a PNG. The OCR runs in the container, in the background.
      - name: Documents upload, background OCR in the image, search, and download
        run: |
          samples=tests/Hestia.Modules.Documents.Tests/Samples
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -F title="CI toaster" -F kind=Warranty -F tags=kitchen \
            -F "files=@$samples/scanned-warranty.pdf;type=application/pdf" -F "files=@$samples/receipt.png;type=image/png" \
            http://localhost:5097/api/documents)
          echo "$body" | jq -c '{id, ocrStatus, files: [.files[] | {fileName, contentType, size}]}'
          id=$(echo "$body" | jq -r .id)
          for i in $(seq 1 120); do
            body=$(curl -sf -H "Cookie: $SESSION_COOKIE" "http://localhost:5097/api/documents/$id")
            [ "$(echo "$body" | jq -r .ocrStatus)" = Pending ] || break
            sleep 1
          done
          echo "$body" | jq -c '{ocrStatus, ocrError, ocrText}'
          echo "$body" | jq -e '.ocrStatus == "Done" and (.ocrText | test("WARRANTY")) and (.ocrText | test("RECEIPT"))'
          # Full-text search finds a word that is only in the OCR text of the scanned PDF.
          curl -sf -H "Cookie: $SESSION_COOKIE" 'http://localhost:5097/api/documents?q=toaster' \
            | jq -e --arg id "$id" '.totalCount == 1 and .items[0].id == $id'
          # The download is the uploaded file.
          file=$(echo "$body" | jq -r '.files[0].id')
          [ "$(curl -sf -H "Cookie: $SESSION_COOKIE" "http://localhost:5097/api/documents/$id/files/$file" | sha256sum | cut -d' ' -f1)" \
            = "$(sha256sum "$samples/scanned-warranty.pdf" | cut -d' ' -f1)" ]
          # The file is on the documents volume, owned by the host's user.
          docker exec hestia-api sh -c 'find /data/documents -type f ! -path "*/tmp/*" | wc -l'
      # T59: the command lists an old file that no document uses, deletes it only with --delete, and keeps the files
      # of the documents. Then /health/ready is still 200 (the documents-storage check writes to the volume).
      - name: documents-clean-files in the image, and the documents-storage readiness check
        run: |
          key="ab/ab$(printf 'c%.0s' $(seq 62))"
          docker exec hestia-api sh -c "mkdir -p /data/documents/ab && printf unused > /data/documents/$key && touch -d '2 hours ago' /data/documents/$key"
          before=$(docker exec hestia-api sh -c 'find /data/documents -type f ! -path "*/tmp/*" | wc -l')
          output=$(docker compose run --rm -T hestia-api documents-clean-files)
          echo "$output"
          echo "$output" | grep -q "unused    $key"
          echo "$output" | grep -q '1 unused file(s)'
          docker exec hestia-api test -f "/data/documents/$key"
          output=$(docker compose run --rm -T hestia-api documents-clean-files --delete)
          echo "$output"
          echo "$output" | grep -q "deleted   $key"
          if docker exec hestia-api test -e "/data/documents/$key"; then echo "The unused file is still there."; exit 1; fi
          after=$(docker exec hestia-api sh -c 'find /data/documents -type f ! -path "*/tmp/*" | wc -l')
          test "$after" = "$((before - 1))"
          curl -sf http://localhost:5097/health/ready
      # T64: --check-missing finds a document row whose file is not on the volume (exit code 2), and nothing after the
      # file is back.
      - name: documents-clean-files --check-missing
        run: |
          output=$(docker compose run --rm -T hestia-api documents-clean-files --check-missing)
          echo "$output"
          echo "$output" | grep -q 'No missing files.'
          file=$(docker exec hestia-api sh -c 'find /data/documents -type f ! -path "*/tmp/*" | head -n 1')
          key=${file#/data/documents/}
          docker exec hestia-api mv "$file" /tmp/moved-document-file
          set +e
          output=$(docker compose run --rm -T hestia-api documents-clean-files --check-missing)
          code=$?
          set -e
          docker exec hestia-api mv /tmp/moved-document-file "$file"
          echo "$output"
          test "$code" = 2
          echo "$output" | grep -q "missing   $key (document "
          output=$(docker compose run --rm -T hestia-api documents-clean-files --check-missing)
          echo "$output" | grep -q 'No missing files.'
      # T19: a repeated task in the image: create, done (the due date moves), undo, the summary, and the Today tile.
      - name: Tasks add, done, undo, summary, and the Today tile
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' \
            -d '{"title":"CI plants","dueOn":"2026-01-01","repeat":{"every":4,"unit":"Days","mode":"FromCompletion"}}' \
            http://localhost:5097/api/tasks)
          echo "$body" | jq -c '{id, dueOn, status, repeat}'
          id=$(echo "$body" | jq -r .id)
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -X POST "http://localhost:5097/api/tasks/$id/done")
          echo "$body" | jq -c '{dueOn, status, completions}'
          echo "$body" | jq -e '.status == "Open" and .dueOn != "2026-01-01" and (.completions | length) == 1
            and .completions[0].dueOn == "2026-01-01"'
          curl -sf -H "Cookie: $SESSION_COOKIE" -X POST "http://localhost:5097/api/tasks/$id/undo" \
            | jq -e '.dueOn == "2026-01-01" and (.completions | length) == 0'
          curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/tasks/summary | tee /dev/stderr | jq -e '.overdue >= 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/today \
            | jq -e '[.cards[] | select(.id == "tasks.due-today")] | length == 1'
      # T22: a room and an item in the image: the room total, the full-text search, the summary, and the CSV export.
      - name: Home rooms, items, search, summary, and the CSV export
        run: |
          room=$(curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' -d '{"name":"CI kitchen"}' \
            http://localhost:5097/api/home/rooms | jq -r .id)
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI dishwasher\",\"roomId\":\"$room\",\"brand\":\"Bosch\",\"quantity\":2,\"purchasePrice\":450.5}" \
            http://localhost:5097/api/home/items)
          echo "$body" | jq -c '{id, roomName, value}'
          echo "$body" | jq -e '.roomName == "CI kitchen" and .value == 901'
          curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/home/rooms \
            | jq -e '[.[] | select(.name == "CI kitchen" and .itemCount == 1 and .totalValue == 901)] | length == 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" 'http://localhost:5097/api/home/items?q=bosch' | jq -e '.totalCount == 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/home/summary | tee /dev/stderr | jq -e '.itemCount >= 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" -o home-export.csv http://localhost:5097/api/home/items/export.csv
          [ "$(head -c 3 home-export.csv | od -An -tx1 | tr -d ' \n')" = efbbbf ]
          grep -q '^CI kitchen,CI dishwasher,,Bosch,,,2,,450.50,' home-export.csv
      # T20: a person with a reminder and a contact, a gift idea, an open loan, the search, and the summary.
      - name: People, contacts, gift ideas, loans, and the summary
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' \
            -d '{"name":"CI Marco","groups":["Friends"],"birthday":{"month":11,"day":2},"contactEveryDays":7}' \
            http://localhost:5097/api/people)
          id=$(echo "$body" | jq -r .person.id)
          echo "$body" | jq -e '.person.groups == ["friends"] and .person.contactOverdue == false'
          curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' -d '{"occurredOn":"2026-01-01","kind":"Call"}' \
            "http://localhost:5097/api/people/$id/interactions" > /dev/null
          curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' -d '{"title":"Kettle","price":49.5}' \
            "http://localhost:5097/api/people/$id/gifts" > /dev/null
          curl -sf -H "Cookie: $SESSION_COOKIE" -H 'Content-Type: application/json' -d '{"itemName":"Camping stove"}' \
            "http://localhost:5097/api/people/$id/loans" > /dev/null
          curl -sf -H "Cookie: $SESSION_COOKIE" "http://localhost:5097/api/people/$id" \
            | jq -e '.person.lastContactOn == "2026-01-01" and .person.contactOverdue and (.giftIdeas | length) == 1 and (.loans | length) == 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" 'http://localhost:5097/api/people?q=marco&group=friends' | jq -e '.totalCount == 1'
          curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/people/summary | tee /dev/stderr \
            | jq -e '(.reachOut | length) >= 1 and .openLoans >= 1'
      - name: A module event reaches its consumer after the commit (in process)
        run: |
          curl -sf -H "Cookie: $SESSION_COOKIE" -X POST -H 'Content-Type: application/json' -d '{"name":"CI kettle"}' \
            http://localhost:5097/api/sample/items
          for i in $(seq 1 30); do
            body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/sample/activity)
            echo "$body" | jq -e '.itemsCreated == 1 and .lastItemName == "CI kettle"' && exit 0
            sleep 1
          done
          echo "$body"
          exit 1
      # T37: the host started without the broker, and all steps above ran without it. /health/ready stays 200, with
      # the events-broker check Degraded.
      - name: Without the broker, the host works and /health/ready is Degraded
        run: |
          body=$(curl -s http://localhost:5097/health/ready)
          echo "$body"
          echo "$body" | grep -q Degraded
          for i in $(seq 1 30); do
            # Into a file first: with pipefail, "grep -q" in a pipe can fail the step (SIGPIPE).
            docker logs hestia-api > host.log 2>&1
            grep -q "RabbitMQ broker is not reachable" host.log && exit 0
            sleep 1
          done
          grep -i -E "rabbit|broker|events:" host.log | tail -20
          exit 1
      # On the server, the finance project runs the broker (its "events" profile) under this name. T37: it starts after
      # the host, as a broker that comes back.
      - name: The RabbitMQ broker for the finance events
        run: |
          docker run -d --name rabbitmq --network finance \
            -e RABBITMQ_DEFAULT_USER=hestia -e RABBITMQ_DEFAULT_PASS=ci-rabbitmq-password rabbitmq:4-alpine
          # Wait for the server before any CLI call: a CLI that runs first makes the Erlang cookie file as root,
          # and the server then cannot read it.
          for i in $(seq 1 60); do
            docker logs rabbitmq > rabbitmq.log 2>&1
            grep -q "Server startup complete" rabbitmq.log && exit 0
            sleep 2
          done
          tail -40 rabbitmq.log
          exit 1
      # T37: the host connects without a restart, declares its queue, and listens to it again.
      - name: The host connects when the broker is back (no restart)
        run: |
          healthy() {
            body=$(curl -s http://localhost:5097/health/ready)
            [[ "$body" == "Healthy" || "$body" == '{"status":"Healthy"'* ]]
          }
          for i in $(seq 1 90); do healthy && break; sleep 1; done
          curl -s http://localhost:5097/health/ready; echo
          docker logs hestia-api > host.log 2>&1
          grep -i -E "rabbit|broker|events:" host.log | tail -20
          healthy
          grep -q "connected to the RabbitMQ broker after the start of the host" host.log
          consumers=$(docker exec rabbitmq rabbitmqctl -q list_consumers queue_name)
          echo "$consumers"
          grep -q '^hestia.api.finance-events' <<< "$consumers"
      - name: The host listens for the finance events (queue bound to the exchange)
        run: |
          for i in $(seq 1 30); do
            docker exec rabbitmq rabbitmqctl -q list_bindings source_name destination_name \
              | grep -P '^hestia\.finance-events\thestia\.api\.finance-events$' && exit 0
            sleep 1
          done
          docker exec rabbitmq rabbitmqctl list_bindings
          exit 1
      - name: The host runs as a non-root user
        run: test "$(docker exec hestia-api id -u)" != 0
      # T24: the backup container wrote a dump at start; a new dump restores into an empty database and with docker/restore.sh.
      - name: Backups (backup.sh) restore, with the sample schema and its data
        run: docker/ci/backup-restore-check.sh http://localhost:5097
      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs personal-finance-api
          docker logs rabbitmq | tail -50
      - name: Stop the stack
        if: always()
        run: |
          docker compose down -v
          docker rm -f personal-finance-api rabbitmq
