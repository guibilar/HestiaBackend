name: CI

on:
  push:
    branches: [main, 'probe/**']
  pull_request:
  # Weekly, so advisories published after the last commit still fail the vulnerability check.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      # Packages that the host ships with; test-only packages and low-severity advisories do not block.
      - name: Known vulnerabilities
        run: sh scripts/check-vulnerable-packages.sh
      - run: dotnet build --no-restore
      # The code-style rules that .editorconfig sets as warnings (file-scoped namespaces); whitespace is left alone.
      - name: Code style
        run: dotnet format style --verify-no-changes --no-restore --severity warn
      - run: dotnet tool restore

      - name: Migrations match the model (each module)
        run: sh scripts/check-migrations.sh

      # Includes the architecture tests (tests/Hestia.Architecture.Tests): the module rules of D6.
      - name: Tests (in-memory database)
        run: |
          set +e
          dotnet test --no-build > test.log 2>&1
          code=$?
          grep -E "failed|Failed|passed|Passed|Skipped|skipped|total|Total|must not reference" test.log | head -40 | while IFS= read -r line; do echo "::notice::$line"; done
          exit $code

      # The tests start PostgreSQL themselves in Docker (Testcontainers) and remove it afterwards.
      - name: Tests (PostgreSQL, migrated from scratch)
        run: |
          set +e
          dotnet test --no-build > test.log 2>&1
          code=$?
          grep -E "failed|Failed|passed|Passed|Skipped|skipped|total|Total|must not reference" test.log | head -40 | while IFS= read -r line; do echo "::notice::$line"; done
          exit $code
        env:
          HESTIA_TEST_POSTGRES: container

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What .env provides on the server.
    env:
      POSTGRES_PASSWORD: ci-database-password
    steps:
      - uses: actions/checkout@v7
      # On the server, the finance project makes this network.
      - name: The shared "finance" network
        run: docker network create finance
      - name: Build and start the stack (host + PostgreSQL, as deployed)
        run: docker compose up -d --build --wait
      - name: /health/ready answers 200
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5097/health/ready && exit 0; sleep 1; done
          exit 1
      - name: The host runs as a non-root user
        run: test "$(docker exec hestia-api id -u)" != 0
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
