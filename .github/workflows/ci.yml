name: CI

on:
  push:
    branches: [main, hestia/T55-probe-vulnerable]  # PROBE (T55)
  pull_request:
  # Weekly, so advisories published after the last commit still fail the vulnerability check.
  schedule:
    - cron: '17 6 * * 1'

# Bash with pipefail: a failed command in a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      # Packages that the host ships with; test-only packages and low-severity advisories do not block.
      - name: Known vulnerabilities
        run: sh scripts/check-vulnerable-packages.sh
      - run: dotnet build --no-restore
      # The code-style rules that .editorconfig sets as warnings (file-scoped namespaces); whitespace is left alone.
      - name: Code style
        run: dotnet format style --verify-no-changes --no-restore --severity warn
      - run: dotnet tool restore

      - name: Migrations match the model (each module)
        run: sh scripts/check-migrations.sh

      # T11: the OCR programs of the host image, so the Documents tests run the real OCR on the sample files.
      - name: OCR programs (ocrmypdf, Tesseract, pdftotext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ocrmypdf tesseract-ocr-eng poppler-utils > /dev/null
          echo "::notice title=OCR programs::$(ocrmypdf --version), $(tesseract --version 2>&1 | head -n 1), $(pdftotext -v 2>&1 | head -n 1)"

      # Includes the architecture tests (tests/Hestia.Architecture.Tests): the module rules of D6.
      # --report-xunit-trx: xUnit v3 writes one TRX file per test project, for the annotations (T26).
      - name: Tests (in-memory database)
        id: tests-in-memory
        run: dotnet test --no-build --results-directory TestResults/in-memory --report-xunit-trx
      # Totals and failed tests as annotations: task sessions cannot read the logs, only the annotations.
      - name: Test results (in-memory database)
        if: always() && steps.tests-in-memory.outcome != 'skipped'
        run: python3 scripts/test-annotations.py in-memory TestResults/in-memory

      # The tests start PostgreSQL and RabbitMQ themselves in Docker (Testcontainers) and remove them afterwards.
      - name: Tests (PostgreSQL migrated from scratch, RabbitMQ)
        id: tests-postgres
        run: dotnet test --no-build --results-directory TestResults/postgres --report-xunit-trx
        env:
          HESTIA_TEST_POSTGRES: container
          HESTIA_TEST_RABBITMQ: container
      - name: Test results (PostgreSQL, RabbitMQ)
        if: always() && steps.tests-postgres.outcome != 'skipped'
        run: python3 scripts/test-annotations.py postgres TestResults/postgres

  # Publishes Hestia.Contracts to GitHub Packages, for the finance backend (T04).
  # main: the version in the project file (once: a version that exists is skipped).
  # A pull request from this repository that changes the contracts: a prerelease, <version>-pr.<number>.<run>.
  contracts-package:
    needs: build-and-test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Decide the version
        id: version
        env:
          # A new push to the pull request: the head before it. A new pull request: empty.
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if git diff --quiet "origin/$GITHUB_BASE_REF...$HEAD_SHA" -- src/Hestia.Contracts; then
              echo "The pull request does not change the contracts: nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A push that does not change the contracts again: the last prerelease is still current.
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
                && git diff --quiet "$BEFORE" "$HEAD_SHA" -- src/Hestia.Contracts; then
              echo "This push does not change the contracts: the last prerelease is current."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "suffix=pr.${{ github.event.number }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: >
          dotnet pack src/Hestia.Contracts -c Release -o packages
          ${{ steps.version.outputs.suffix && format('--version-suffix {0}', steps.version.outputs.suffix) || '' }}
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        run: |
          ls packages
          echo "::notice title=Hestia.Contracts::Published $(ls packages/*.nupkg | xargs -n1 basename)"
          dotnet nuget push "packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # What .env provides on the server.
    env:
      POSTGRES_PASSWORD: ci-database-password
      EVENTS_RABBITMQ_URL: amqp://hestia:ci-rabbitmq-password@rabbitmq:5672
      HESTIA_USERNAME: ci
      HESTIA_PASSWORD: ci-password-long-enough
    steps:
      - uses: actions/checkout@v7
      # T03: the key pair of the gateway tokens, as in the README ("Sign-in"). New for each run.
      - name: The gateway signing key
        run: |
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/gateway.key"
          echo "GATEWAY_SIGNING_KEY=$(openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/gateway.key" -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/gateway.key"
      # On the server, the finance project makes this network.
      - name: The shared "finance" network
        run: docker network create finance
      # On the server, the finance project runs the finance backend under this name. Here, a small nginx echo.
      - name: A stand-in for the finance backend
        run: >
          docker run -d --name personal-finance-api --network finance
          -v "$PWD/docker/ci/finance-stub.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
      # On the server, the finance project runs the broker (its "events" profile) under this name.
      - name: The RabbitMQ broker for the finance events
        run: |
          docker run -d --name rabbitmq --network finance \
            -e RABBITMQ_DEFAULT_USER=hestia -e RABBITMQ_DEFAULT_PASS=ci-rabbitmq-password rabbitmq:4-alpine
          # Wait for the server before any CLI call: a CLI that runs first makes the Erlang cookie file as root,
          # and the server then cannot read it.
          for i in $(seq 1 60); do
            docker logs rabbitmq > rabbitmq.log 2>&1
            grep -q "Server startup complete" rabbitmq.log && exit 0
            sleep 2
          done
          tail -40 rabbitmq.log
          exit 1
      - name: Build and start the stack (host, PostgreSQL, and backup, as deployed)
        run: docker compose up -d --build --wait
      - name: /health/ready answers 200 (the databases and finance answer)
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5097/health/ready && exit 0; sleep 1; done
          exit 1
      # T03: health, sign-in, the session cookie, a module, finance (the stub), sign-out, and 401 without a session.
      - name: Smoke test (docker/smoke-test.sh)
        run: docker/smoke-test.sh http://localhost:5097
      - name: Sign in (a session cookie for the next steps)
        run: |
          session=$(curl -sf -D - -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"username\":\"$HESTIA_USERNAME\",\"password\":\"$HESTIA_PASSWORD\"}" http://localhost:5097/api/Auth/login \
            | grep -i '^set-cookie: finance_session=' | sed -E 's/^[^:]*: ([^;]*);.*/\1/I')
          test -n "$session"
          echo "SESSION_COOKIE=$session" >> "$GITHUB_ENV"
      - name: Finance paths go through the host to finance, with a gateway token and without the session cookie
        run: |
          body=$(curl -sf -H 'Host: hestia.example.ts.net' -H 'X-Forwarded-Proto: https' -H "Cookie: $SESSION_COOKIE; theme=dark" \
            'http://localhost:5097/api/Transaction?categoryId=4&startDate=2026-10-01')
          echo "$body" | jq 'del(.authorization)'
          echo "$body" | jq -e '.stub == "finance"
            and .path == "/api/Transaction?categoryId=4&startDate=2026-10-01"
            and .host == "hestia.example.ts.net"
            and .forwardedProto == "https"
            and .cookie == "theme=dark"
            and (.authorization | startswith("Bearer "))'
          # The claims of the token (the tests check the signature as finance does).
          payload=$(echo "$body" | jq -r '.authorization | ltrimstr("Bearer ") | split(".")[1] | gsub("-"; "+") | gsub("_"; "/")')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "$payload" | base64 -d | jq -e '.iss == "hestia-api" and .aud == "finance" and .name == "ci"
            and .scope == "full" and (.exp - .iat) == 60'
      - name: Module paths stay in the host
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/sample/items)
          echo "$body"
          echo "$body" | jq -e 'has("stub") | not'
      # T08: the Today cards. The stub answers every finance report with its echo, so the account list does not
      # load and the Money module is "Partial"; the four tiles are there. The host found its time zone (Today__TimeZone).
      - name: Today answers with the Money cards first
        run: |
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/today)
          echo "$body" | jq -c '{date, modules, tiles: [.cards[] | select(.type == "Tile") | .id]}'
          echo "$body" | jq -e '.modules[0].module == "Money" and .modules[0].status == "Partial"
            and ([.cards[] | select(.type == "Tile") | .id] == ["money.spent-this-month", "money.left-over-this-month", "money.net-worth", "money.budgets"])'
      # T11: a document with a scanned PDF (no text layer) and a PNG. The OCR runs in the container, in the background.
      - name: Documents upload, background OCR in the image, search, and download
        run: |
          samples=tests/Hestia.Modules.Documents.Tests/Samples
          body=$(curl -sf -H "Cookie: $SESSION_COOKIE" -F title="CI toaster" -F kind=Warranty -F tags=kitchen \
            -F "files=@$samples/scanned-warranty.pdf;type=application/pdf" -F "files=@$samples/receipt.png;type=image/png" \
            http://localhost:5097/api/documents)
          echo "$body" | jq -c '{id, ocrStatus, files: [.files[] | {fileName, contentType, size}]}'
          id=$(echo "$body" | jq -r .id)
          for i in $(seq 1 120); do
            body=$(curl -sf -H "Cookie: $SESSION_COOKIE" "http://localhost:5097/api/documents/$id")
            [ "$(echo "$body" | jq -r .ocrStatus)" = Pending ] || break
            sleep 1
          done
          echo "$body" | jq -c '{ocrStatus, ocrError, ocrText}'
          echo "$body" | jq -e '.ocrStatus == "Done" and (.ocrText | test("WARRANTY")) and (.ocrText | test("RECEIPT"))'
          # Full-text search finds a word that is only in the OCR text of the scanned PDF.
          curl -sf -H "Cookie: $SESSION_COOKIE" 'http://localhost:5097/api/documents?q=toaster' \
            | jq -e --arg id "$id" '.totalCount == 1 and .items[0].id == $id'
          # The download is the uploaded file.
          file=$(echo "$body" | jq -r '.files[0].id')
          [ "$(curl -sf -H "Cookie: $SESSION_COOKIE" "http://localhost:5097/api/documents/$id/files/$file" | sha256sum | cut -d' ' -f1)" \
            = "$(sha256sum "$samples/scanned-warranty.pdf" | cut -d' ' -f1)" ]
          # The file is on the documents volume, owned by the host's user.
          docker exec hestia-api sh -c 'find /data/documents -type f ! -path "*/tmp/*" | wc -l'
      - name: A module event reaches its consumer after the commit (in process)
        run: |
          curl -sf -H "Cookie: $SESSION_COOKIE" -X POST -H 'Content-Type: application/json' -d '{"name":"CI kettle"}' \
            http://localhost:5097/api/sample/items
          for i in $(seq 1 30); do
            body=$(curl -sf -H "Cookie: $SESSION_COOKIE" http://localhost:5097/api/sample/activity)
            echo "$body" | jq -e '.itemsCreated == 1 and .lastItemName == "CI kettle"' && exit 0
            sleep 1
          done
          echo "$body"
          exit 1
      - name: The host listens for the finance events (queue bound to the exchange)
        run: |
          for i in $(seq 1 30); do
            docker exec rabbitmq rabbitmqctl -q list_bindings source_name destination_name \
              | grep -P '^hestia\.finance-events\thestia\.api\.finance-events$' && exit 0
            sleep 1
          done
          docker exec rabbitmq rabbitmqctl list_bindings
          exit 1
      - name: The host runs as a non-root user
        run: test "$(docker exec hestia-api id -u)" != 0
      # T24: the backup container wrote a dump at start; a new dump restores into an empty database and with docker/restore.sh.
      - name: Backups (backup.sh) restore, with the sample schema and its data
        run: docker/ci/backup-restore-check.sh http://localhost:5097
      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs personal-finance-api
          docker logs rabbitmq | tail -50
      - name: Stop the stack
        if: always()
        run: |
          docker compose down -v
          docker rm -f personal-finance-api rabbitmq
