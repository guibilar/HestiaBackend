# TEMPORARY (T03): the task session cannot build locally or read CI logs. This job generates the Identity migration,
# fixes the code style, commits the result to the branch, and writes failed tests as annotations.
# Removed before the review.
name: T03 probe

on:
  push:
    branches: [hestia/T03-gateway-auth]

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet tool restore
      - name: Generate the Identity migration (once)
        run: |
          if [ ! -d src/Modules/Identity/Hestia.Modules.Identity/Infrastructure/Migrations ]; then
            dotnet ef migrations add InitialCreate \
              --project src/Modules/Identity/Hestia.Modules.Identity \
              --startup-project src/Hestia.Api \
              --context IdentityDbContext \
              --output-dir Infrastructure/Migrations
          fi
      - name: Code style (fix)
        run: dotnet format style --severity warn --no-restore || true
      - name: Commit the generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "T03 probe: generated Identity migration and code style fixes"
            git push
            echo "::notice title=Probe::Pushed generated files. Pull them."
          fi
      - run: dotnet build --no-restore
      - name: Tests (in-memory)
        run: dotnet test --no-build 2>&1 | tee "$RUNNER_TEMP/test.log" || true
      - name: Test annotations (in-memory)
        run: python3 .github/probe/annotate.py "$RUNNER_TEMP/test.log"
      - name: Tests (PostgreSQL)
        env:
          HESTIA_TEST_POSTGRES: container
        run: dotnet test --no-build 2>&1 | tee "$RUNNER_TEMP/test-pg.log" || true
      - name: Test annotations (PostgreSQL)
        run: python3 .github/probe/annotate.py "$RUNNER_TEMP/test-pg.log"
